<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wheely</title>

  <!-- Ruffle CDN -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    /* =========================
       BASE RESET (IMPORTANT)
    ========================= */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* =========================
       MAIN GAME CONTAINER
    ========================= */
    #game-container {
      width: 100vw;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      /* embed scaling (Google Sites friendly) */
      transform: scale(0.55);
      transform-origin: center;
    }

    /* Ruffle holder fills full space */
    #ruffle-holder {
      width: 100%;
      height: 100%;
    }

    ruffle-player {
      width: 100%;
      height: 100%;
    }

    /* =========================
       UI BUTTONS
    ========================= */
    #ui {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 999;
    }

    button {
      padding: 8px 12px;
      margin-left: 5px;
      cursor: pointer;
    }

    /* safety: prevent overflow anywhere */
    * {
      box-sizing: border-box;
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
</head>

<body>

  <div id="game-container">
    <div id="ruffle-holder"></div>
  </div>

  <div id="ui">
    <button onclick="toggleFullscreen()">Fullscreen</button>
    <button onclick="clearSave()">Reset Save</button>
  </div>

  <script>
    // ---------------------------
    // RUFFLE SETUP
    // ---------------------------
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      backgroundColor: "#000000",
      letterbox: "on",
      scale: "showAll"
    };

    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();

    document.getElementById("ruffle-holder").appendChild(player);

    // Load SWF
    player.load("Wheely.swf");

    // ---------------------------
    // FULLSCREEN
    // ---------------------------
    function toggleFullscreen() {
      const elem = document.documentElement;

      if (!document.fullscreenElement) {
        elem.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    // ---------------------------
    // SAVE SYSTEM
    // ---------------------------
    const SAVE_KEY = "ruffle_game_save";

    function saveData(data) {
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    }

    function loadData() {
      const raw = localStorage.getItem(SAVE_KEY);
      return raw ? JSON.parse(raw) : null;
    }

    function clearSave() {
      localStorage.removeItem(SAVE_KEY);
      alert("Save cleared!");
    }

    window.saveFromGame = function(data) {
      saveData(data);
    };

    window.loadToGame = function() {
      return loadData();
    };

    // ---------------------------
    // BACKUP SYSTEM
    // ---------------------------
    setInterval(() => {
      const backup = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key) backup[key] = localStorage.getItem(key);
      }
      localStorage.setItem("ruffle_backup", JSON.stringify(backup));
    }, 5000);
  </script>

</body>
</html>
